<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scratchpad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span id="status" title="offline"></span>
    <nav id="tabs" aria-label="Scratchpads"></nav>
    <button id="new" title="New scratchpad">+</button>
    <button id="snapshot" title="Save a copy as a local file">⤓</button>
    <button id="delete" title="Delete scratchpad">🗑</button>
    <button id="settings" title="Server">⚙</button>
  </header>
  <textarea id="text" spellcheck="false" autocapitalize="off" placeholder="Create a file with +"></textarea>
  <script src="app.js"></script>
</body>
</html>
